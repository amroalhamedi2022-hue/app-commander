name: App Commander source checks (no APK)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK for JVM tests (not packaging)
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM tests and Android static lint without APK packaging
        # Neither task assembles or signs an APK; packaging remains prohibited.
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace
